<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Did It Come Back?</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6a66; --line: #dedcd5;
    --accent: #2f5d50; --accent-ink: #ffffff; --quote-bg: #f1efe8; --err: #b3261e;
    --badge-photos: #7a4a9c; --badge-size_chart: #b85c00; --badge-garment: #a3262f;
    --badge-expectation: #1f5fa8; --badge-fulfilment: #3d7a3a; --badge-not_enough_data: #6b6a66;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe6; --muted: #a09f99; --line: #33332f;
      --accent: #7fc0ad; --accent-ink: #0f1a16; --quote-bg: #262624; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 12px 16px 40px; max-width: 1200px; margin: 0 auto; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  label:first-of-type { margin-top: 0; }
  textarea, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
  textarea { min-height: 56px; }
  textarea.tall { min-height: 110px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .hint { color: var(--muted); font-size: 12px; }
  #result .empty { color: var(--muted); }
  .badge { display: inline-block; font-size: 26px; font-weight: 800; letter-spacing: .02em; padding: 8px 16px; border-radius: 8px; color: #fff; text-transform: uppercase; }
  .conf { margin: 10px 0 0; color: var(--muted); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  h3 { margin: 18px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  blockquote { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--quote-bg); border-radius: 0 6px 6px 0; font-style: italic; }
  pre { white-space: pre-wrap; word-wrap: break-word; background: var(--quote-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 6px 0; font: 13px/1.4 ui-monospace, Menlo, monospace; }
  .copywrap { position: relative; }
  .copywrap button { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 4px 8px; }
  .owner { font-size: 17px; font-weight: 600; margin-top: 6px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .error { color: var(--err); white-space: pre-wrap; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<link rel="stylesheet" href="console.css">
</head>
<body>
<nav class="oc-nav" aria-label="Owner Console">
  <div class="oc-nav-inner">
    <a class="oc-brand" href="/dashboard.html">Owner Console</a>
    <div class="oc-links">
      <a href="/dashboard.html" aria-current="page">Dashboard</a>
      <a href="/index.html">Returns</a>
      <a href="/prep.html">Prep</a>
      <a href="/ads.html">Ads</a>

    </div>

</nav>
<header>
  <h1>Why Did It Come Back?</h1>
  <p>Paste a listing, its size chart and the returns. Get one cause, verbatim evidence and a paste-ready fix.</p>
</header>
<main>
  <section class="panel">
<!-- asin-import -->
<!-- "Import from ASIN" widget. Self-contained: include this snippet at the top of the
     left column in index.html. It POSTs {asin} to /api/import-asin and fills the form
     fields (#title #bullets #description #size_chart #photos_note #returns #reviews #messages).
     Uses the page's existing CSS variables/classes (label, input, button, .hint, .error, .spinner). -->
<div id="asin-import" style="margin:0 0 14px; padding:12px; border:1px dashed var(--line); border-radius:8px;">
  <label for="asin" style="margin-top:0">Import from Amazon ASIN <span class="hint">(pulls 1–3 star reviews via Apify, ~15–60s)</span></label>
  <div style="display:flex; gap:8px; align-items:center;">
    <input id="asin" placeholder="e.g. B0DJXRHWJH or a /dp/ URL" spellcheck="false" style="flex:1; min-width:0; resize:none">
    <button id="asin-go" type="button">Import</button>
  </div>
  <p id="asin-status" class="hint" style="margin:6px 0 0; min-height:1.2em"></p>
</div>
<script>
(() => {
  const g = id => document.getElementById(id);
  const oneLine = s => String(s ?? '').replace(/\s*\n\s*/g, ' ').replace(/\|/g, '/').trim();
  const input = g('asin'), btn = g('asin-go'), status = g('asin-status');
  if (!input || !btn || !status) return;

  function fill(d) {
    const L = d.listing || {};
    const set = (id, v) => { const el = g(id); if (el) el.value = v; };
    set('title', L.title || '');
    set('bullets', (L.bullets || []).join('\n'));
    set('description', L.description || '');
    set('size_chart', L.size_chart || '');
    set('photos_note', L.photos_note || '');
    set('returns', (d.returns || []).map(r => `${r.reason_code || ''} | ${r.size_ordered || ''} | ${oneLine(r.comment)}`).join('\n'));
    set('reviews', (d.reviews || []).map(oneLine).filter(Boolean).join('\n'));
    set('messages', (d.messages || []).map(oneLine).filter(Boolean).join('\n'));
  }

  async function run() {
    const asin = input.value.trim();
    if (!asin) { status.textContent = 'Enter an ASIN first.'; return; }
    btn.disabled = true; input.disabled = true;
    status.className = 'hint';
    status.innerHTML = '<span class="spinner"></span>Importing reviews from Amazon via Apify… usually 15–60s';
    const t0 = performance.now();
    try {
      const res = await fetch('/api/import-asin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ asin }) });
      let data = {};
      try { data = await res.json(); } catch { /* non-JSON error body */ }
      if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
      fill(data);
      const m = data._meta || {};
      status.textContent = `Imported ${m.review_count ?? (data.returns || []).length} critical reviews for ${m.resolved_asin || asin} in ${((performance.now() - t0) / 1000).toFixed(1)}s. No size chart on Amazon — paste yours if you have one, then Diagnose.`;
    } catch (e) {
      status.className = 'error';
      status.textContent = 'Import failed: ' + e.message + ' — you can still paste the listing and returns by hand.';
    } finally {
      btn.disabled = false; input.disabled = false;
    }
  }

  btn.addEventListener('click', run);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run(); } });
})();
</script>

    <label for="title">Listing title</label>
    <input id="title" placeholder="e.g. Women's Ribbed Knit Midi Dress">
    <label for="bullets">Bullets <span class="hint">(one per line)</span></label>
    <textarea id="bullets"></textarea>
    <label for="description">Description</label>
    <textarea id="description" class="tall"></textarea>
    <label for="size_chart">Size chart</label>
    <textarea id="size_chart" class="tall"></textarea>
    <label for="photos_note">Photos note <span class="hint">(what the photos show, model size, lighting)</span></label>
    <textarea id="photos_note"></textarea>
    <label for="returns">Returns <span class="hint">(one per line: reason_code | size | comment)</span></label>
    <textarea id="returns" class="tall"></textarea>
    <label for="reviews">Reviews <span class="hint">(one per line)</span></label>
    <textarea id="reviews"></textarea>
    <label for="messages">Buyer messages <span class="hint">(one per line)</span></label>
    <textarea id="messages"></textarea>
    <div class="row">
      <button id="load" type="button">Load example</button>
      <button id="go" class="primary" type="button">Diagnose</button>
      <span id="status" class="hint"></span>
    </div>
  </section>

  <section class="panel" id="result">
    <p class="empty">Result will appear here.</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);

const EXAMPLE = {
  title: "Women's Ribbed Knit Midi Dress – Long Sleeve, Bodycon Fit",
  bullets: [
    "Soft stretch rib knit, 95% viscose 5% elastane",
    "Body-hugging silhouette, hits mid-calf",
    "True to size – order your usual size",
    "Machine wash cold, lay flat to dry"
  ],
  description: "Our best-selling ribbed midi is cut close to the body with a generous stretch so it moves with you. Long sleeves, high crew neck, side slit. Model is 5'9\" and wears a size S.",
  size_chart: "XS: bust 30-32in, waist 23-25in, hips 33-35in\nS: bust 32-34in, waist 25-27in, hips 35-37in\nM: bust 34-36in, waist 27-29in, hips 37-39in\nL: bust 36-38in, waist 29-31in, hips 39-41in\nXL: bust 38-40in, waist 31-33in, hips 41-43in",
  photos_note: "5 studio photos on a size-S model, front/back/side, plus one flat lay. Colour accurate (dark olive).",
  returns: [
    "TOO_SMALL | M | I'm always a medium and this would not go over my hips. Chart says M is 37-39 hips, I'm 38.",
    "TOO_SMALL | L | Ordered my normal L based on the chart, couldn't zip... there's no zip, couldn't pull it past my shoulders. Runs at least a size small.",
    "TOO_SMALL | S | I'm a 33in bust and the S was skin tight, sleeves too tight to bend my arms. Very cute otherwise.",
    "TOO_SMALL | M | Sized up to M just in case and it was STILL too small. Not true to size at all.",
    "DID_NOT_FIT | XL | Chart says XL hips 41-43, I'm 42 and it barely covered me and rode up. Would need XXL.",
    "TOO_SMALL | L | Fabric and colour are lovely but it fits like a M. Exchanged for XL."
  ],
  reviews: [
    "5 stars for quality, 2 for sizing. Go up a full size.",
    "Runs small! I'm normally S and needed M.",
    "Beautiful dress, colour exactly like the photos. Sizing is off though."
  ],
  messages: [
    "Hi, I'm 5'6\" and usually a UK 12 – should I get M or L? Reviews say it runs small.",
    "Is the chart body measurements or garment measurements?"
  ]
};

$('load').onclick = () => {
  $('title').value = EXAMPLE.title;
  $('bullets').value = EXAMPLE.bullets.join('\n');
  $('description').value = EXAMPLE.description;
  $('size_chart').value = EXAMPLE.size_chart;
  $('photos_note').value = EXAMPLE.photos_note;
  $('returns').value = EXAMPLE.returns.join('\n');
  $('reviews').value = EXAMPLE.reviews.join('\n');
  $('messages').value = EXAMPLE.messages.join('\n');
};

function buildPayload() {
  return {
    listing: {
      title: $('title').value.trim(),
      bullets: lines($('bullets').value),
      description: $('description').value.trim(),
      size_chart: $('size_chart').value.trim(),
      photos_note: $('photos_note').value.trim()
    },
    returns: lines($('returns').value).map(l => {
      const p = l.split('|').map(s => s.trim());
      return { reason_code: p[0] || '', size_ordered: p[1] || '', comment: p.slice(2).join(' | ') };
    }),
    reviews: lines($('reviews').value),
    messages: lines($('messages').value)
  };
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CAUSES = ['photos','size_chart','garment','expectation','fulfilment','not_enough_data'];

function render(r) {
  const cause = CAUSES.includes(r.cause) ? r.cause : 'not_enough_data';
  const conf = Math.max(0, Math.min(1, Number(r.confidence) || 0));
  const ev = Array.isArray(r.evidence) ? r.evidence : [];
  const fix = r.fix || {};
  let html = `
    <div><span class="badge" style="background:var(--badge-${cause})">${esc(cause.replace('_',' '))}</span></div>
    <p class="conf">Confidence ${(conf*100).toFixed(0)}%${r.sku ? ' · SKU ' + esc(r.sku) : ''}</p>
    <div class="bar"><i style="width:${conf*100}%"></i></div>`;
  if (r.owner_line) html += `<h3>In one line</h3><p class="owner">${esc(r.owner_line)}</p>`;
  html += `<h3>Evidence</h3>` + (ev.length ? ev.map(q => `<blockquote>${esc(q)}</blockquote>`).join('') : '<p class="hint">No quotes returned.</p>');
  if (fix.paste_ready) {
    html += `<h3>Fix · change the ${esc(fix.what_to_change || '')}</h3>
      <div class="copywrap"><pre id="fixtext">${esc(fix.paste_ready)}</pre><button type="button" data-copy="fixtext">Copy</button></div>`;
  }
  if (r.keep_size_message) {
    html += `<h3>Pre-purchase "which size should I keep?" message</h3>
      <div class="copywrap"><pre id="keeptext">${esc(r.keep_size_message)}</pre><button type="button" data-copy="keeptext">Copy</button></div>`;
  }
  if (r._meta) html += `<p class="meta">${esc(r._meta.model)} · prompt ${esc(r._meta.prompt_source)} · ${(r._meta.latency_ms/1000).toFixed(1)}s</p>`;
  $('result').innerHTML = html;
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText($(b.dataset.copy).textContent); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1500); }
    catch { b.textContent = 'Select & copy'; }
  });
}

$('go').onclick = async () => {
  const payload = buildPayload();
  if (!payload.listing.title && !payload.returns.length) { $('status').textContent = 'Add a listing and some returns first (or Load example).'; return; }
  $('go').disabled = true;
  $('status').innerHTML = '<span class="spinner"></span>Diagnosing… usually 10–40s';
  $('result').innerHTML = '<p class="empty">Working…</p>';
  const t0 = performance.now();
  try {
    const res = await fetch('/api/diagnose', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error((data.error || res.statusText) + (data.raw ? '\n\n' + data.raw : ''));
    render(data);
    $('status').textContent = `Done in ${((performance.now()-t0)/1000).toFixed(1)}s`;
  } catch (e) {
    $('result').innerHTML = `<p class="error">${esc(e.message)}</p>`;
    $('status').textContent = 'Failed';
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
